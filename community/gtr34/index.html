<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>BNR34</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width">
    <link rel="stylesheet" href="./assets/style.css">
</head>

<body>

    <div id="container">
        <div id="components">
            <div class="rpmGauge">
                <div class="oilIndicator">
                    <img src="./assets/sm-needle.png" class="oilNeedle">
                </div>
                <img src="./assets/big-needle.png" class="rpmNeedle">
                <img src="./assets/rpmgauge.png" class="bg">
            </div>
            <div class="kmhGauge">
                <img src="./assets/big-needle.png" class="speedNeedle">
                <div id="kmTotal">000000</div>
                <img src="./assets/kmhgauge.png" class="bg">
            </div>
            <div class="cltGauge">
                <img src="./assets/sm-needle.png" class="cltNeedle">
                <img src="./assets/cltgauge.png" class="bg">
            </div>
            <div class="fuelGauge">
                <img src="./assets/sm-needle.png" class="fuelNeedle">
                <img src="./assets/fuelgauge.png" class="bg">
            </div>
        </div>
        <div id="all-icons">
            <div id="top-info">
                <section class="icons">
                    <span id="turnLeft"><img src="../../assets/_path_/turn-left.svg" alt="turnLeft" /></span>
                    <span id="ECUErr"><img src="../../assets/_path_/injection.svg" alt="ECUErr" /></span>
                    <span id="battAlt"><img src="../../assets/_path_/battery.svg" alt="battAlt" /></span>
                    <span id="eBrake"><img src="../../assets/_path_/handbrake.svg" alt="eBrake" /></span>
                    <span id="oilSwitch"><img src="../../assets/_path_/oil.svg" alt="oilSwitch" /></span>
                    <span id="openDoor"><img src="../../assets/_path_/door.svg" alt="openDoor" /></span>
                    <span id="turnRight"><img src="../../assets/_path_/turn-right.svg" alt="turnRight" /></span>
                </section>
                <section class="icons bottom">
                    <span id="highBeam"><img src="../../assets/_path_/hheadlight.svg" alt="highBeam" /></span>
                    <span id="parkLights"><img src="../../assets/_path_/headlight.svg" alt="parkLights" /></span>
                    <span id="fogLights"><img src="../../assets/_path_/milha.svg" alt="fogLights" /></span>
                    <span id="auxLights"><img src="../../assets/_path_/neblina.svg" alt="auxLights" /></span>
                    <span id="fan"><img src="../../assets/_path_/fan.svg" alt="fan" /></span>
                </section>
            </div>
        </div>
    </div>

    <div id="loader">
        <video width="1000" height="300" id="introVideo">
          <source src="./assets/r34intro.mp4" type="video/mp4">
        </video>
    </div>


    <script src="../../assets/defaultSettings.js" type="text/javascript"></script>
    <script src="../../assets/client.js" type="text/javascript"></script>
    <script src="./assets/script.js" type="text/javascript"></script>
</body>

</html>
