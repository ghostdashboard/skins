<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <title>911</title>
  <meta name="description" content="">
  <meta name="viewport" content="width=device-width">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div id="container">
    <div class="main">
      <img id="AddOnleft" class="add-on color-mode" src="./assets/cluster/dark/booster.png" alt="">
      <img id="AddOnright" class="add-on color-mode" src="./assets/cluster/dark/olipress.png" alt="">
      <img id="" class="leftV color-mode" src="./assets/cluster/dark/clusterSpeed.png" alt="">
      <img id="" class="rightV color-mode" src="./assets/cluster/dark/clusterFuelTemp.png" alt="">
      <img id="" class="centerV color-mode" src="./assets/cluster/dark/clusterRpm.png" alt="">
      <img id="" class="ponteiroRpm" src="./assets/cluster/ponteiro.png" alt="">
      <img id="" class="ponteiroSpeed" src="./assets/cluster/ponteiro.png" alt="">
      <img id="" class="ponteiroFuel" src="./assets/cluster/ponteiro.png" alt="">
      <img id="" class="ponteiroTemp" src="./assets/cluster/ponteiro.png" alt="">
      <img id="" class="ponteiroFuel" src="./assets/cluster/ponteiro.png" alt="">
      <img id="" class="ponteiroOilPress" src="./assets/cluster/ponteiro.png" alt="">
      <img id="" class="ponteiroBooster" src="./assets/cluster/ponteiro.png" alt="">
      <span class="speedText">km/h</span>
      <span id="speedo" class="speedNumber">- - -</span>

      <span class="kmTotalText">Km total</span>
      <span class="kmTotal" id="kmTotal">000000</span>

      <span class="kmtripText">Trip</span>
      <span class="kmtrip" id="kmTrip">000000</span>
      <span class="lambda-text">Lambda</span>
      <span class="lambda" id="lambda">1.00</span>
      <span class="tps-text">Tps</span>
      <div class="tps">
        <span id="tps">--</span>
        <span>%</span>
      </div>
    </div>
    <div id="center-mask">
      <div id="top-info">
        <section class="icons">
          <span id="turnLeft"><img src="../../assets/icons/turn-left.svg" alt="turnLeft" /></span>
          <span id="ECUErr"><img src="../../assets/icons/injection.svg" alt="ECUErr" /></span>
          <span id="battAlt"><img src="../../assets/icons/battery.svg" alt="battAlt" /></span>
          <span id="eBrake"><img src="../../assets/icons/handbrake.svg" alt="eBrake" /></span>
          <span id="oilSwitch"><img src="../../assets/icons/oil.svg" alt="oilSwitch" /></span>
          <span id="highBeam"><img src="../../assets/icons/hheadlight.svg" alt="highBeam" /></span>
          <span id="parkLights"><img src="../../assets/icons/headlight.svg" alt="parkLights" /></span>
          <span id="fogLights"><img src="../../assets/icons/milha.svg" alt="fogLights" /></span>
          <span id="auxLights"><img src="../../assets/icons/neblina.svg" alt="auxLights" /></span>
          <span id="fan"><img src="../../assets/icons/fan.svg" alt="fan" /></span>
          <span id="openDoor"><img src="../../assets/icons/door.svg" alt="openDoor" /></span>
          <span id="turnRight"><img src="../../assets/icons/turn-right.svg" alt="turnRight" /></span>
        </section>
      </div>
    </div>
    <script src="../../assets/defaultSettings.js" type="text/javascript"></script>
    <script src="../../assets/client.js" type="text/javascript"></script>
    <script src="./script.js" type="text/javascript"></script>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const changeColor = document.querySelector("#changeColor");
        changeColor.addEventListener("click", function () {
          const cluster = document.getElementsByClassName('color-mode');
          for (let i = 0; i < cluster.length; i++) {
            if (cluster[i].src) {  // Verifica se o elemento tem a propriedade src
              if (cluster[i].src.includes('dark')) {
                cluster[i].src = cluster[i].src.replace('dark', 'white');
              } else if (cluster[i].src.includes('white')) {
                cluster[i].src = cluster[i].src.replace('white', 'dark');
              }
            }
          }
        });
        const activeAddOns = document.querySelector("#activeAddOns");
        activeAddOns.addEventListener("click", function () {
          var img1 = document.getElementById('AddOnleft');
          var img2 = document.getElementById('AddOnright');

          if (img1.style.display === 'none') {
            img1.style.display = 'block';
            img2.style.display = 'block';
          } else {
            img1.style.display = 'none';
            img2.style.display = 'none';
          }
        });
      });
    </script>
  </div>
</body>

</html>
