<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <title>Dashboard</title>
  <meta name="description" content="">
  <meta name="viewport" content="width=device-width">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div id="container">

    <div class="toplines">
      <svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="365px" height="42px" version="1.1" style="shape-rendering:geometricPrecision; text-rendering:geometricPrecision; image-rendering:optimizeQuality; fill-rule:evenodd; clip-rule:evenodd" viewBox="0 0 114.13 13.13" xmlns:xlink="http://www.w3.org/1999/xlink">
        <path class="fil0 str0" d="M0.35 3.7c0.02,0 5.75,-2.84 5.96,-2.92 0.55,-0.21 1.02,-0.46 2.14,-0.43 28.2,0.75 55.86,1.49 84.05,2.44 1.13,0.04 2.32,0.22 3.33,0.74l17.95 9.25"/>
      </svg>
      <svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="365px" height="42px" version="1.1" style="shape-rendering:geometricPrecision; text-rendering:geometricPrecision; image-rendering:optimizeQuality; fill-rule:evenodd; clip-rule:evenodd" viewBox="0 0 114.13 13.13" xmlns:xlink="http://www.w3.org/1999/xlink">
        <path class="fil0 str0" d="M0.35 3.7c0.02,0 5.75,-2.84 5.96,-2.92 0.55,-0.21 1.02,-0.46 2.14,-0.43 28.2,0.75 55.86,1.49 84.05,2.44 1.13,0.04 2.32,0.22 3.33,0.74l17.95 9.25"/>
      </svg>
    </div>

    <div id="top-info">
      <section class="icons">
        <span id="SETAESQ"><img src="../../assets/_path_/turn-left.svg" /></span>
        <span id="INJ"><img src="../../assets/_path_/injection.svg" /></span>
        <span id="battAlt"><img src="../../assets/_path_/battery.svg" /></span>
        <span id="eBrake"><img src="../../assets/_path_/handbrake.svg" /></span>
        <span id="OIL"><img src="../../assets/_path_/oil.svg" /></span>
        <span id="SETADIR"><img src="../../assets/_path_/turn-right.svg" /></span>
      </section>
      <section class="icons bottom">
        <span id="highBeam"><img src="../../assets/_path_/hheadlight.svg" /></span>
        <span id="parkLights"><img src="../../assets/_path_/headlight.svg" /></span>
        <span id="fogLights"><img src="../../assets/_path_/milha.svg" /></span>
        <span id="NEBLINA"><img src="../../assets/_path_/neblina.svg" /></span>
        <span id="FAN"><img src="../../assets/_path_/fan.svg" /></span>
        <span id="DOOR"><img src="../../assets/_path_/door.svg" /></span>
      </section>
    </div>

    <div id="top-gauges">
      <div id="left-gauge-mini" class="gauge-mini">
        <span><div></div></span>
        <div class="value">
          <img src="img/fuel.svg" />
          <div><span id="comb-now">00</span>%</div>
        </div>
      </div>
      <div id="right-gauge-mini" class="gauge-mini">
        <span><div></div></span>
        <div class="value">
          <img src="img/clt.svg" />
          <div><span id="clt-now">00</span>°C</div>
        </div>
      </div>
    </div>

    <div id="main-gauges">
      <div id="left-gauge" class="circle">
        <div class="numbers" id="rpmnumbers"></div>
        <div class="bignumber" id="gear">N</div>
        <img src="./img/gaugebg.png" alt="gaugebg">
        <div class="barclip">
          <div class="rpmbar"></div>
        </div>
        <div class="bgcolor"></div>
      </div>

      <div id="right-gauge" class="circle">
        <div class="numbers" id="kmhnumbers"></div>
        <div class="bignumber" id="kmh">0</div>
        <img src="./img/gaugebg.png" alt="gaugebg">
        <div class="barclip">
          <div class="kmhbar"></div>
        </div>
        <div class="bgcolor"></div>
      </div>
    </div>

    <div id="centerLeftWidget">
      <div class="micro-gauges">
        <div class="micro-gauge">
          <div>BATT</div>
          <span id="batt-level">0</span>
          <p>VOLTS</p>
        </div>
        <div class="micro-gauge">
          <div>FUEL</div>
          <span id="comb-press-now">0</span>
          <p>BAR</p>
        </div>
        <div class="micro-gauge">
          <div>LAMBDA</div>
          <span id="afr-now">0</span>
          <p>LAMBDA</p>
        </div>
        <div class="micro-gauge">
          <div>BOOST</div>
          <span id="map-now">0</span>
          <p>BAR</p>
        </div>
        <div class="micro-gauge">
          <div>OIL</div>
          <span id="oil-press-now">0</span>
          <p>BAR</p>
        </div>
        <div class="micro-gauge">
          <div>MAT</div>
          <span id="mat-now">0</span>
          <p>°C</p>
        </div>
      </div>
    </div>

    <div class="navcursor">
      <svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="125px" height="53px" version="1.1" style="shape-rendering:geometricPrecision; text-rendering:geometricPrecision; image-rendering:optimizeQuality; fill-rule:evenodd; clip-rule:evenodd" viewBox="0 0 12528 5306" xmlns:xlink="http://www.w3.org/1999/xlink">
        <g>
         <polygon class="mainColorFill" points="6264,4207 12528,5306 6264,0 0,5306 "/>
         <polygon class="fil1" points="6264,4207 12528,5306 6264,2873 "/>
         <polygon class="fil2" points="6264,2873 0,5306 6264,0 "/>
         <polygon class="fil3" points="6264,2873 12528,5306 6264,0 "/>
         <polygon class="fil4" points="6264,4207 0,5306 6264,2873 "/>
        </g>
      </svg>
    </div>

    <div id="bottom-odo">
      <div class="left">
        <div>TRIP<span id="km-trip">0</span>km</div>
      </div>
      <div class="right">
        <div>TOTAL<span id="km-total">0</span>km</div>
      </div>
    </div>

    <div id="bottomanimation"></div>

  </div>


  <script src="../../assets/defaultSettings.js" type="text/javascript"></script>
  <script src="../../assets/client.js" type="text/javascript"></script>
  <script src="script.js?v3.2" type="text/javascript"></script>

</body>
</html>
