<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>GTR 35</title>
</head>

<body>
    <div id="container">
        <div class="main">
            <!-- Speed G -->
            <div class="speedGauge">
                <span id="speedo" class="speedNumber">---</span>
                <img src="./assets/speeg.png" alt="">
                <img src="./assets/pontm.png" class="ponteiroSpeed" alt="">
            </div>
            <!-- RPM G -->
            <div class="rpmGauge">
                <img src="./assets/rpmg.png" alt="">
                <img src="./assets/ponteiro.png" class="ponteiroRpm" alt="">
                <span class="kmtotaltext">km</span>
                <span id="kmTotal" class="kmtotal">000000</span>
                <span class="triptext">trp</span>
                <span id="kmTrip" class="trip">000000</span>
                <span class="lbdText">Lbd</span>
                <span id="lambda" class="lbdNumber">0.00</span>
                <span class="tpsText">Tps</span>
                <span id="tps" class="tpsNumber">0.0</span>
            </div>
            <!-- Tiple G -->
            <div class="oilFuelCoolGauge">
                <img src="./assets/3g.png" alt="">
                <img src="./assets/pontp.png" class="ponteiroCoolant" alt="">
                <img src="./assets/pontp.png" class="ponteiroFuel" alt="">
                <span id="gear" class="gearNumber">n</span>
            </div>
            <!-- Icons -->
            <div class="icons">
                <span id="ECUErr"><img src="../../assets/icons/injection.svg" alt=""
                        class="absolute engCheckIcon"></span>
                <span id="eBrake"><img src="../../assets/icons/handbrake.svg" alt="" class="absolute eBrakeIcon"></span>
                <span id="battAlt"><img src="../../assets/icons/battery.svg" alt="" class="absolute battIcon"></span>
                <span id="oilSwitch"><img src="../../assets/icons/oil.svg" alt="" class="absolute oilIcon"></span>
                <span id="parkLights"><img src="../../assets/icons/headlight.svg" alt=""
                        class="absolute headlightIcon"></span>
                <span id="highBeam"><img src="../../assets/icons/hheadlight.svg" alt=""
                        class="absolute hheadlightIcon"></span>
                <span id="turnLeft"><img src="../../assets/icons/turn-left.svg" alt=""
                        class="absolute turnLicon"></span>
                <span id="turnRight"><img src="../../assets/icons/turn-right.svg" alt=""
                        class="absolute turnRicon"></span>
            </div>
        </div>
        <script src="../../assets/defaultSettings.js" type="text/javascript"></script>
        <script src="../../assets/client.js" type="text/javascript"></script>
        <script src="./script.js" type="text/javascript"></script>
    </div>
</body>

</html>
