<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <title>Dashboard</title>
  <meta name="description" content="">
  <meta name="viewport" content="width=device-width">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="container">
    <div id="mainGauge">
      <div id="fuelGauge">
        <div id="tab"></div>
        <div id="fuelLevel"></div>
      </div>
      <div id="speedo">0</div>
      <div id="gear">N</div>
      <div id="cltNum">0</div>
      <div id="cltNeedle">
        <img src="img/needle.png" alt="needle">
      </div>
      <div id="rpmNeedle">
        <img src="img/needle.png" alt="needle">
      </div>
      <img src="img/cat-bg.png" alt="gauge-bg" id="gaugeBg">
    </div>

    <div id="top-info">
      <section class="icons">
        <span id="turnLeft"><img src="../../assets/_path_/turn-left.svg" alt="turnLeft" /></span>
        <span id="ECUErr"><img src="../../assets/_path_/injection.svg" alt="ECUErr" /></span>
        <span id="battAlt"><img src="../../assets/_path_/battery.svg" alt="battAlt" /></span>
        <span id="eBrake"><img src="../../assets/_path_/handbrake.svg" alt="eBrake" /></span>
        <span id="turnRight"><img src="../../assets/_path_/turn-right.svg" alt="turnRight" /></span>
      </section>
      <section class="icons center">
        <span id="parkLights"><img src="../../assets/_path_/headlight.svg" alt="parkLights" /></span>
        <span id="fogLights"><img src="../../assets/_path_/milha.svg" alt="fogLights" /></span>
        <span id="auxLights"><img src="../../assets/_path_/neblina.svg" alt="auxLights" /></span>
        <span id="fan"><img src="../../assets/_path_/fan.svg" alt="fan" /></span>
      </section>
      <section class="icons bottom">
        <span id="oilSwitch"><img src="../../assets/_path_/oil.svg" alt="oilSwitch" /></span>
        <span id="openDoor"><img src="../../assets/_path_/door.svg" alt="openDoor" /></span>
        <span id="highBeam"><img src="../../assets/_path_/hheadlight.svg" alt="highBeam" /></span>
      </section>
    </div>

    <div id="bottom-odo">
      <div class="right">
        <div><span>KM</span><span id="kmTotal">0</span></div>
      </div>
      <div class="left">
        <div><span>TRIP</span><span id="kmTrip">0</span></div>
      </div>
    </div>

    <img src="" alt="custom-bg" id="customBg">
  </div>


  <script src="../../assets/defaultSettings.js" type="text/javascript"></script>
  <script src="../../assets/client.js" type="text/javascript"></script>
  <script src="script.js" type="text/javascript"></script>

</body>
</html>
